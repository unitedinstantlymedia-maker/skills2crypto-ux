[build]
  base    = "."
  command = "npm ci && npm run build:client"
  publish = "client/dist"

# Required env vars on Netlify (Site settings → Build & deploy → Environment):
#   VITE_API_BASE   = https://your-railway-app.up.railway.app
#   PUBLIC_URL      = https://your-netlify-site.netlify.app   (used at build for tonconnect manifest)
#   VITE_PUBLIC_URL = https://your-netlify-site.netlify.app
#   VITE_USE_MOCK_ESCROW = false
#   VITE_FEE_ADDRESS     = 0xYourPlatformColdWallet
# Plus the public-side WalletConnect / TonConnect / chain IDs your app expects.

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so wouter routes resolve on hard refresh.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
