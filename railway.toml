# Railway service config for the Skills2Crypto Express + Socket.IO backend.
# The frontend ships separately to Netlify — this service only serves the API.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build:server"

[deploy]
startCommand = "npm run start:server"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (Railway → Variables):
#   NODE_ENV=production
#   PORT=5000                                  (Railway also injects $PORT automatically)
#   ALLOWED_ORIGINS=https://your-netlify-site.netlify.app
#   DATABASE_URL=postgresql://...
#   UPSTASH_REDIS_REST_URL=...
#   UPSTASH_REDIS_REST_TOKEN=...
#   ORACLE_PRIVATE_KEY=...
#   BSC_RPC_URL=...                BSC_ESCROW_ADDRESS=...
#   ETH_RPC_URL=...                ETH_ESCROW_ADDRESS=...
#   TRON_FULL_HOST=...             TRON_ESCROW_ADDRESS_BASE58=...   TRON_ORACLE_PRIVATE_KEY=...
#   TON_API_ENDPOINT=...           TON_ORACLE_MNEMONIC=...          TON_ESCROW_ADDRESS=...
