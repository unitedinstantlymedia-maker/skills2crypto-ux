# Railway service config for the Skills2Crypto Express + Socket.IO backend.
# The frontend ships separately to Netlify — this service only serves the API.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build:server"

[deploy]
startCommand = "npm run start:server"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (Railway → Variables):
#   NODE_ENV=production
#   PORT=5000                                  (Railway also injects $PORT automatically)
#   ALLOWED_ORIGINS=https://your-netlify-site.netlify.app
#   CLIENT_PUBLIC_URL=https://your-netlify-site.netlify.app   (used to build challenge invite links)
#   DATABASE_URL=postgresql://...
#   UPSTASH_REDIS_REST_URL=...
#   UPSTASH_REDIS_REST_TOKEN=...
#   ORACLE_PRIVATE_KEY=...
#   BSC_RPC_URL=...        BSC_ESCROW_ADDRESS=...        BSC_CHAIN_ID=56
#   ETH_RPC_URL=...        ETH_ESCROW_ADDRESS=...        ETH_CHAIN_ID=1
#   TRON_RPC_URL=...       TRON_USDT_CONTRACT=...        TRON_ESCROW_CONTRACT=...
#   TRON_PLATFORM_WALLET=...   TRON_CHAIN_ID=728126428   TRON_MIN_GAS_TRX=50
#   TON_RPC_URL=...        TON_API_KEY=...               TON_ESCROW_CONTRACT=...
#   TON_ORACLE_MNEMONIC="word1 word2 ... word24"         TON_PLATFORM_WALLET=...
#   PUBLIC_URL=https://your-netlify-site.netlify.app   (used at build time to
#       substitute __PUBLIC_URL__ in tonconnect-manifest.json — required for
#       TonKeeper to accept the manifest in production).
